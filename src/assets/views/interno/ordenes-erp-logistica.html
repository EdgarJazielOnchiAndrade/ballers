<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Órdenes ERP Logística | Ballers</title>
  <link rel="stylesheet" href="../../css/base.css"/>
  <style>
    body{
      margin:0;
      background:#0f172a;
      color:#fff;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .erp-layout{
      display:grid;
      grid-template-columns:260px 1fr;
      min-height:100vh;
    }
    .erp-sidebar{
      background:#111827;
      border-right:1px solid #1f2937;
      padding:22px 16px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .erp-brand{
      font-size:1.3rem;
      font-weight:700;
      color:#fff;
      text-decoration:none;
    }
    .erp-subtitle{
      color:#9ca3af;
      font-size:.92rem;
      margin-top:-8px;
    }
    .erp-menu{
      display:grid;
      gap:8px;
      margin-top:8px;
    }
    .erp-menu a{
      display:block;
      padding:12px 14px;
      border-radius:12px;
      color:#e5e7eb;
      text-decoration:none;
      transition:.2s;
      border:1px solid transparent;
    }
    .erp-menu a:hover{
      background:#1f2937;
      border-color:#374151;
    }
    .erp-menu a.active{
      background:#2563eb;
      border-color:#3b82f6;
      color:#fff;
      font-weight:700;
    }
    .erp-user{
      margin-top:auto;
      background:#0b1220;
      border:1px solid #1f2937;
      border-radius:14px;
      padding:14px;
    }
    .erp-user strong{
      display:block;
      margin-bottom:4px;
    }
    .erp-user small{
      color:#9ca3af;
      display:block;
      margin-bottom:12px;
    }
    .erp-user .btn{
      width:100%;
      text-align:center;
      display:inline-block;
      box-sizing:border-box;
    }
    .erp-main{
      padding:24px;
    }
    .erp-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }
    .erp-title h1{
      margin:0;
      font-size:2rem;
    }
    .erp-title p{
      margin:8px 0 0;
      color:#9ca3af;
    }
    .section{
      background:#111827;
      border:1px solid #1f2937;
      border-radius:18px;
      padding:20px;
      margin-bottom:18px;
    }
    .toolbar{
      display:grid;
      gap:12px;
      grid-template-columns:1fr 220px;
      margin-bottom:16px;
    }
    .toolbar input,
    .toolbar select,
    .form-row input,
    .form-row select{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #2a3142;
      background:#141b2a;
      color:#fff;
      box-sizing:border-box;
    }
    .form-grid{
      display:grid;
      gap:12px;
      grid-template-columns:1fr 1fr;
    }
    .form-row{
      display:grid;
      gap:6px;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .item-box{
      background:#0b1220;
      border:1px solid #1f2937;
      border-radius:14px;
      padding:12px;
      margin-top:10px;
    }
    .item-line{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }
    .total-box{
      margin-top:14px;
      padding:14px;
      border-radius:14px;
      background:#0b1220;
      border:1px solid #1f2937;
      font-size:1.1rem;
      font-weight:700;
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:#0b1220;
      border:1px solid #1f2937;
      border-radius:16px;
      overflow:hidden;
    }
    th,td{
      padding:12px 10px;
      text-align:left;
      border-bottom:1px solid #1f2937;
      vertical-align:top;
    }
    th{
      background:#131c2e;
    }
    .tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:.85rem;
      font-weight:700;
      border:1px solid #333;
    }
    .tag.pendiente{
      color:#ffd166;
      border-color:#70561a;
    }
    .tag.procesada{
      color:#7CFC98;
      border-color:#1f6b37;
    }
    .tag.cancelada{
      color:#ff8b8b;
      border-color:#7a2f2f;
    }
    .msg{
      margin-top:12px;
      font-weight:700;
    }
    .msg.error{color:#ff6b6b}
    .msg.ok{color:#7CFC98}
    .mini-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .empty{
      padding:18px;
      border:1px dashed #374151;
      border-radius:14px;
      color:#9ca3af;
    }
    .hidden{
      display:none;
    }
    @media (max-width:1100px){
      .form-grid,
      .toolbar{
        grid-template-columns:1fr;
      }
    }
    @media (max-width:800px){
      .erp-layout{
        grid-template-columns:1fr;
      }
      .erp-sidebar{
        border-right:none;
        border-bottom:1px solid #1f2937;
      }
    }
  </style>
</head>
<body>
  <div class="erp-layout">
    <aside class="erp-sidebar">
      <a class="erp-brand" href="dashboard-erp-logistica.html">Ballers ERP</a>
      <div class="erp-subtitle">Panel de logística</div>

      <nav class="erp-menu">
        <a href="dashboard-erp-logistica.html">Dashboard</a>
        <a href="ordenes-erp-logistica.html" class="active">Órdenes</a>
        <a href="inventario-erp-logistica.html">Inventario</a>
        <a href="procesos-erp-logistica.html">Procesos</a>
        <a href="recursos-erp-logistica.html">Recursos</a>
      </nav>

      <div class="erp-user">
        <strong id="erp-user-name">Logística</strong>
        <small id="erp-user-role">logistica</small>
        <a class="btn btn--ghost" href="index-logistica.html">Volver al panel</a>
      </div>
    </aside>

    <main class="erp-main">
      <div class="erp-top">
        <div class="erp-title">
          <h1>Órdenes ERP Logística</h1>
          <p>Gestión operativa de órdenes para control de flujo e inventario.</p>
        </div>

        <button class="btn" type="button" id="btn-toggle-form">+ Nueva Orden</button>
      </div>

      <section class="section hidden" id="form-section">
        <h3 style="margin-top:0">Nueva Orden Operativa</h3>

        <form id="orden-form">
          <div class="form-grid">
            <div class="form-row">
              <label for="cliente_id">Cliente</label>
              <select id="cliente_id" required>
                <option value="">Selecciona un cliente</option>
              </select>
            </div>

            <div class="form-row">
              <label for="usuario_id">Usuario responsable</label>
              <select id="usuario_id" required>
                <option value="">Selecciona un usuario</option>
              </select>
            </div>

            <div class="form-row">
              <label for="producto_id">Producto</label>
              <select id="producto_id">
                <option value="">Selecciona un producto</option>
              </select>
            </div>

            <div class="form-row">
              <label for="cantidad">Cantidad</label>
              <input id="cantidad" type="number" min="1" />
            </div>
          </div>

          <div class="actions">
            <button class="btn btn--ghost" type="button" id="btn-agregar-item">+ Agregar producto</button>
          </div>

          <div id="items-wrap"></div>

          <div class="total-box">
            Total: $<span id="total-orden">0.00</span>
          </div>

          <div class="actions">
            <button class="btn" type="submit">Crear Orden</button>
            <button class="btn btn--ghost" type="button" id="btn-cancelar-form">Cancelar</button>
            <button class="btn btn--ghost" type="button" id="btn-limpiar">Limpiar</button>
          </div>

          <div id="mensaje" class="msg"></div>
        </form>
      </section>

      <section class="section">
        <div class="toolbar">
          <input id="buscar" type="text" placeholder="Buscar por cliente o usuario" />
          <select id="filtro-estado">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="procesada">Procesada</option>
            <option value="cancelada">Cancelada</option>
          </select>
        </div>

        <div id="tabla-wrap"></div>
      </section>
    </main>
  </div>

  <script>
    const clienteSelect = document.getElementById('cliente_id');
    const usuarioSelect = document.getElementById('usuario_id');
    const productoSelect = document.getElementById('producto_id');
    const cantidadInput = document.getElementById('cantidad');
    const itemsWrap = document.getElementById('items-wrap');
    const totalOrden = document.getElementById('total-orden');
    const mensaje = document.getElementById('mensaje');
    const tablaWrap = document.getElementById('tabla-wrap');
    const buscar = document.getElementById('buscar');
    const filtroEstado = document.getElementById('filtro-estado');
    const formSection = document.getElementById('form-section');

    let clientes = [];
    let usuarios = [];
    let productos = [];
    let ordenes = [];
    let itemsOrden = [];

    function money(n) {
      return Number(n || 0).toFixed(2);
    }

    function cargarUsuario() {
      const nombre = localStorage.getItem('ballers_user_name') || localStorage.getItem('ballers_user_nombre') || 'Logística';
      const rol = localStorage.getItem('ballers_user_rol') || 'logistica';
      document.getElementById('erp-user-name').textContent = nombre;
      document.getElementById('erp-user-role').textContent = rol;
    }

    function toggleForm(show) {
      formSection.classList.toggle('hidden', !show);
    }

    function limpiarFormulario() {
      document.getElementById('orden-form').reset();
      itemsOrden = [];
      renderItems();
      mensaje.textContent = '';
      mensaje.className = 'msg';
    }

    function cargarSelect(select, data, labelKey) {
      select.innerHTML = '<option value="">Selecciona una opción</option>' +
        data.map(item => `<option value="${item.id}">${item[labelKey]}</option>`).join('');
    }

    function renderItems() {
      if (!itemsOrden.length) {
        itemsWrap.innerHTML = '<div class="empty">Aún no has agregado productos a la orden.</div>';
        totalOrden.textContent = '0.00';
        return;
      }

      let total = 0;

      itemsWrap.innerHTML = itemsOrden.map((item, index) => {
        const subtotal = Number(item.precio_unitario) * Number(item.cantidad);
        total += subtotal;

        return `
          <div class="item-box">
            <div class="item-line">
              <strong>${item.producto_nombre}</strong>
              <button type="button" class="btn btn--ghost" onclick="eliminarItem(${index})">X</button>
            </div>
            <div class="muted">Cantidad: ${item.cantidad}</div>
            <div class="muted">Precio unitario: $${money(item.precio_unitario)}</div>
            <div class="muted">Subtotal: $${money(subtotal)}</div>
          </div>
        `;
      }).join('');

      totalOrden.textContent = money(total);
    }

    function tagEstado(estado) {
      return `<span class="tag ${estado}">${estado}</span>`;
    }

    function filtrarOrdenes() {
      const texto = buscar.value.trim().toLowerCase();
      const estado = filtroEstado.value;

      return ordenes.filter(o => {
        const coincideTexto =
          !texto ||
          (o.cliente_nombre || '').toLowerCase().includes(texto) ||
          (o.usuario_nombre || '').toLowerCase().includes(texto);

        const coincideEstado = !estado || o.estado === estado;

        return coincideTexto && coincideEstado;
      });
    }

    function renderTabla() {
      const lista = filtrarOrdenes();

      if (!lista.length) {
        tablaWrap.innerHTML = '<div class="empty">No hay órdenes para mostrar.</div>';
        return;
      }

      tablaWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(o => `
              <tr>
                <td>ORD-${String(o.id).padStart(3,'0')}</td>
                <td>${o.cliente_nombre}</td>
                <td>${new Date(o.fecha).toLocaleDateString('es-MX')}</td>
                <td>$${money(o.total)}</td>
                <td>${tagEstado(o.estado)}</td>
                <td>
                  <div class="mini-actions">
                    <button class="btn btn--ghost" onclick="verOrden(${o.id})">Ver</button>
                    <button class="btn btn--ghost" onclick="procesarOrden(${o.id})">Procesar</button>
                    <button class="btn btn--ghost" onclick="cambiarEstado(${o.id}, 'cancelada')">Cancelar</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function cargarClientes() {
      const resp = await fetch('/api/clientes');
      clientes = await resp.json();
      cargarSelect(clienteSelect, clientes, 'nombre');
    }

    async function cargarUsuarios() {
      const resp = await fetch('/api/usuarios-internos');
      usuarios = await resp.json();
      cargarSelect(usuarioSelect, usuarios, 'nombre');
    }

    async function cargarProductos() {
      const resp = await fetch('/api/productos');
      productos = await resp.json();
      cargarSelect(productoSelect, productos, 'nombre');
    }

    async function cargarOrdenes() {
      const resp = await fetch('/api/ordenes');
      ordenes = await resp.json();
      renderTabla();
    }

    document.getElementById('btn-toggle-form').addEventListener('click', () => toggleForm(true));
    document.getElementById('btn-cancelar-form').addEventListener('click', () => toggleForm(false));
    document.getElementById('btn-limpiar').addEventListener('click', limpiarFormulario);

    document.getElementById('btn-agregar-item').addEventListener('click', () => {
      const producto_id = productoSelect.value;
      const cantidad = Number(cantidadInput.value || 0);

      if (!producto_id || cantidad <= 0) {
        alert('Selecciona un producto y una cantidad válida');
        return;
      }

      const producto = productos.find(p => Number(p.id) === Number(producto_id));
      if (!producto) return;

      itemsOrden.push({
        producto_id: Number(producto.id),
        producto_nombre: producto.nombre,
        cantidad,
        precio_unitario: Number(producto.costo_unitario || 0)
      });

      productoSelect.value = '';
      cantidadInput.value = '';
      renderItems();
    });

    document.getElementById('orden-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      mensaje.textContent = '';
      mensaje.className = 'msg';

      const cliente_id = clienteSelect.value;
      const usuario_id = usuarioSelect.value;

      if (!cliente_id || !usuario_id || !itemsOrden.length) {
        mensaje.textContent = 'Selecciona cliente, usuario y agrega al menos un producto';
        mensaje.classList.add('error');
        return;
      }

      try {
        const resp = await fetch('/api/ordenes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cliente_id,
            usuario_id,
            productos: itemsOrden
          })
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mensaje.textContent = data.message || 'No se pudo crear la orden';
          mensaje.classList.add('error');
          return;
        }

        mensaje.textContent = 'Orden creada correctamente';
        mensaje.classList.add('ok');

        limpiarFormulario();
        toggleForm(false);
        await cargarOrdenes();
      } catch (error) {
        console.error(error);
        mensaje.textContent = 'Error de conexión con el servidor';
        mensaje.classList.add('error');
      }
    });

    async function procesarOrden(id) {
      try {
        const resp = await fetch('/api/ordenes/procesar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orden_id: id })
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          alert(data.message || 'No se pudo procesar la orden');
          return;
        }

        alert(data.message);
        await cargarOrdenes();
      } catch (error) {
        console.error(error);
        alert('Error de conexión con el servidor');
      }
    }

    async function cambiarEstado(id, estado) {
      try {
        const resp = await fetch(`/api/ordenes/${id}/estado`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado })
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          alert(data.message || 'No se pudo cambiar el estado');
          return;
        }

        await cargarOrdenes();
      } catch (error) {
        console.error(error);
        alert('Error de conexión con el servidor');
      }
    }

    async function verOrden(id) {
      try {
        const resp = await fetch(`/api/ordenes/${id}`);
        const data = await resp.json();

        if (!resp.ok) {
          alert(data.message || 'No se pudo obtener la orden');
          return;
        }

        const detalle = data.items.map(i =>
          `${i.producto_nombre} | Cantidad: ${i.cantidad} | Subtotal: $${money(i.subtotal)}`
        ).join('\n');

        alert(
          `Orden #${data.id}\nCliente: ${data.cliente_nombre}\nUsuario: ${data.usuario_nombre}\nEstado: ${data.estado}\nTotal: $${money(data.total)}\n\nItems:\n${detalle}`
        );
      } catch (error) {
        console.error(error);
        alert('Error de conexión con el servidor');
      }
    }

    function eliminarItem(index) {
      itemsOrden.splice(index, 1);
      renderItems();
    }

    window.procesarOrden = procesarOrden;
    window.cambiarEstado = cambiarEstado;
    window.verOrden = verOrden;
    window.eliminarItem = eliminarItem;

    buscar.addEventListener('input', renderTabla);
    filtroEstado.addEventListener('change', renderTabla);

    cargarUsuario();

    Promise.all([cargarClientes(), cargarUsuarios(), cargarProductos(), cargarOrdenes()])
      .then(() => renderItems())
      .catch(err => console.error(err));
  </script>
</body>
</html>
