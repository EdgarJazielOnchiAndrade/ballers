<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Procesos ERP Logística | Ballers</title>
  <link rel="stylesheet" href="../../css/base.css"/>
  <style>
    body{
      margin:0;
      background:#0f172a;
      color:#fff;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .erp-layout{
      display:grid;
      grid-template-columns:260px 1fr;
      min-height:100vh;
    }
    .erp-sidebar{
      background:#111827;
      border-right:1px solid #1f2937;
      padding:22px 16px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .erp-brand{
      font-size:1.3rem;
      font-weight:700;
      color:#fff;
      text-decoration:none;
    }
    .erp-subtitle{
      color:#9ca3af;
      font-size:.92rem;
      margin-top:-8px;
    }
    .erp-menu{
      display:grid;
      gap:8px;
      margin-top:8px;
    }
    .erp-menu a{
      display:block;
      padding:12px 14px;
      border-radius:12px;
      color:#e5e7eb;
      text-decoration:none;
      transition:.2s;
      border:1px solid transparent;
    }
    .erp-menu a:hover{
      background:#1f2937;
      border-color:#374151;
    }
    .erp-menu a.active{
      background:#2563eb;
      border-color:#3b82f6;
      color:#fff;
      font-weight:700;
    }
    .erp-user{
      margin-top:auto;
      background:#0b1220;
      border:1px solid #1f2937;
      border-radius:14px;
      padding:14px;
    }
    .erp-user strong{
      display:block;
      margin-bottom:4px;
    }
    .erp-user small{
      color:#9ca3af;
      display:block;
      margin-bottom:12px;
    }
    .erp-user .btn{
      width:100%;
      text-align:center;
      display:inline-block;
      box-sizing:border-box;
    }
    .erp-main{
      padding:24px;
    }
    .erp-title h1{
      margin:0;
      font-size:2rem;
    }
    .erp-title p{
      margin:8px 0 0;
      color:#9ca3af;
    }
    .section{
      background:#111827;
      border:1px solid #1f2937;
      border-radius:18px;
      padding:20px;
      margin:20px 0;
    }
    .toolbar{
      display:grid;
      gap:12px;
      grid-template-columns:1fr 220px;
      margin-bottom:16px;
    }
    .toolbar input,
    .toolbar select{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #2a3142;
      background:#141b2a;
      color:#fff;
      box-sizing:border-box;
    }
    .card-grid{
      display:grid;
      gap:16px;
      grid-template-columns:repeat(3,1fr);
      margin-top:20px;
    }
    .card-mini{
      background:#111827;
      border:1px solid #1f2937;
      border-radius:16px;
      padding:18px;
    }
    .card-mini small{
      display:block;
      color:#9ca3af;
      margin-bottom:8px;
    }
    .card-mini strong{
      font-size:1.2rem;
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:#0b1220;
      border:1px solid #1f2937;
      border-radius:16px;
      overflow:hidden;
    }
    th,td{
      padding:12px 10px;
      text-align:left;
      border-bottom:1px solid #1f2937;
      vertical-align:top;
    }
    th{
      background:#131c2e;
    }
    .tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:.85rem;
      font-weight:700;
      border:1px solid #333;
    }
    .tag.activo{
      color:#7CFC98;
      border-color:#1f6b37;
    }
    .tag.inactivo{
      color:#ff8b8b;
      border-color:#7a2f2f;
    }
    .empty{
      padding:18px;
      border:1px dashed #374151;
      border-radius:14px;
      color:#9ca3af;
    }
    @media (max-width:1100px){
      .toolbar,.card-grid{
        grid-template-columns:1fr;
      }
    }
    @media (max-width:800px){
      .erp-layout{
        grid-template-columns:1fr;
      }
      .erp-sidebar{
        border-right:none;
        border-bottom:1px solid #1f2937;
      }
    }
  </style>
</head>
<body>
  <div class="erp-layout">
    <aside class="erp-sidebar">
      <a class="erp-brand" href="dashboard-erp-logistica.html">Ballers ERP</a>
      <div class="erp-subtitle">Panel de logística</div>

      <nav class="erp-menu">
        <a href="dashboard-erp-logistica.html">Dashboard</a>
        <a href="ordenes-erp-logistica.html">Órdenes</a>
        <a href="inventario-erp-logistica.html">Inventario</a>
        <a href="procesos-erp-logistica.html" class="active">Procesos</a>
        <a href="recursos-erp-logistica.html">Recursos</a>
      </nav>

      <div class="erp-user">
        <strong id="erp-user-name">Logística</strong>
        <small id="erp-user-role">logistica</small>
        <a class="btn btn--ghost" href="index-logistica.html">Volver al panel</a>
      </div>
    </aside>

    <main class="erp-main">
      <div class="erp-title">
        <h1>Procesos ERP Logística</h1>
        <p>Vista operativa de procesos vinculados al flujo logístico y control interno.</p>
      </div>

      <section class="card-grid">
        <article class="card-mini">
          <small>Total de procesos</small>
          <strong id="kpi-total">0</strong>
        </article>
        <article class="card-mini">
          <small>Procesos activos</small>
          <strong id="kpi-activos">0</strong>
        </article>
        <article class="card-mini">
          <small>Procesos inactivos</small>
          <strong id="kpi-inactivos">0</strong>
        </article>
      </section>

      <section class="section">
        <div class="toolbar">
          <input id="buscar" type="text" placeholder="Buscar por nombre o descripción" />
          <select id="filtro-estado">
            <option value="">Todos los estados</option>
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>

        <div id="tabla-wrap"></div>
      </section>
    </main>
  </div>

  <script src="../../js/app.js"></script>

<script>
  protegerRuta({
    tipo: 'interno',
    roles: ['administrador', 'ventas', 'logistica', 'soporte'],
    redirectSiNoAuth: '../login.html',
    redirectSiNoPermitido: '../login.html'
  });
</script>

<script>
    const tablaWrap = document.getElementById('tabla-wrap');
    const buscar = document.getElementById('buscar');
    const filtroEstado = document.getElementById('filtro-estado');

    let procesos = [];

    function cargarUsuario() {
      const nombre = localStorage.getItem('ballers_user_name') || localStorage.getItem('ballers_user_nombre') || 'Logística';
      const rol = localStorage.getItem('ballers_user_rol') || 'logistica';
      document.getElementById('erp-user-name').textContent = nombre;
      document.getElementById('erp-user-role').textContent = rol;
    }

    function tagEstado(valor) {
      return `<span class="tag ${String(valor).toLowerCase()}">${valor}</span>`;
    }

    function actualizarKpis(listaBase) {
      document.getElementById('kpi-total').textContent = listaBase.length;
      document.getElementById('kpi-activos').textContent = listaBase.filter(p => p.estado === 'activo').length;
      document.getElementById('kpi-inactivos').textContent = listaBase.filter(p => p.estado === 'inactivo').length;
    }

    function filtrarProcesos() {
      const texto = buscar.value.trim().toLowerCase();
      const estado = filtroEstado.value;

      return procesos.filter(p => {
        const coincideTexto =
          !texto ||
          (p.nombre_proceso || '').toLowerCase().includes(texto) ||
          (p.descripcion || '').toLowerCase().includes(texto);

        const coincideEstado = !estado || p.estado === estado;

        return coincideTexto && coincideEstado;
      });
    }

    function renderTabla() {
      const lista = filtrarProcesos();

      if (!lista.length) {
        tablaWrap.innerHTML = '<div class="empty">No hay procesos para mostrar.</div>';
        return;
      }

      tablaWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Proceso</th>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Fecha de creación</th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(p => `
              <tr>
                <td>${p.id}</td>
                <td>${p.nombre_proceso || '-'}</td>
                <td>${p.descripcion || '-'}</td>
                <td>${tagEstado(p.estado || '-')}</td>
                <td>${p.creado_en ? new Date(p.creado_en).toLocaleString('es-MX') : '-'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function cargarProcesos() {
      try {
        const resp = await fetch('/api/procesos-stats');

        if (resp.ok) {
          const data = await resp.json();
          procesos = Array.isArray(data) ? data.map((item, idx) => ({
            id: item.id || idx + 1,
            nombre_proceso: item.nombre || item.nombre_proceso || 'Proceso',
            descripcion: item.descripcion || 'Sin descripción',
            estado: item.estado || 'activo',
            creado_en: item.creado_en || null
          })) : [];
        } else {
          throw new Error('Sin endpoint');
        }
      } catch (error) {
        console.error(error);
        procesos = [
          { id: 1, nombre_proceso: 'Recepción de mercancía', descripcion: 'Registro de productos recibidos en almacén.', estado: 'activo', creado_en: null },
          { id: 2, nombre_proceso: 'Control de salidas', descripcion: 'Seguimiento de productos enviados o entregados.', estado: 'activo', creado_en: null },
          { id: 3, nombre_proceso: 'Verificación de stock', descripcion: 'Revisión periódica de existencias.', estado: 'activo', creado_en: null },
          { id: 4, nombre_proceso: 'Proceso de revisión', descripcion: 'Inspección logística temporalmente detenida.', estado: 'inactivo', creado_en: null }
        ];
      }

      actualizarKpis(procesos);
      renderTabla();
    }

    buscar.addEventListener('input', renderTabla);
    filtroEstado.addEventListener('change', renderTabla);

    cargarUsuario();
    cargarProcesos();
  </script>
</body>
</html>
