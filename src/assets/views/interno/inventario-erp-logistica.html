<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventario ERP Logística | Ballers</title>
  <link rel="stylesheet" href="../../css/base.css"/>
  <style>
    body{
      margin:0;
      background:#0f172a;
      color:#fff;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .erp-layout{
      display:grid;
      grid-template-columns:260px 1fr;
      min-height:100vh;
    }
    .erp-sidebar{
      background:#111827;
      border-right:1px solid #1f2937;
      padding:22px 16px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .erp-brand{
      font-size:1.3rem;
      font-weight:700;
      color:#fff;
      text-decoration:none;
    }
    .erp-subtitle{
      color:#9ca3af;
      font-size:.92rem;
      margin-top:-8px;
    }
    .erp-menu{
      display:grid;
      gap:8px;
      margin-top:8px;
    }
    .erp-menu a{
      display:block;
      padding:12px 14px;
      border-radius:12px;
      color:#e5e7eb;
      text-decoration:none;
      transition:.2s;
      border:1px solid transparent;
    }
    .erp-menu a:hover{
      background:#1f2937;
      border-color:#374151;
    }
    .erp-menu a.active{
      background:#2563eb;
      border-color:#3b82f6;
      color:#fff;
      font-weight:700;
    }
    .erp-user{
      margin-top:auto;
      background:#0b1220;
      border:1px solid #1f2937;
      border-radius:14px;
      padding:14px;
    }
    .erp-user strong{
      display:block;
      margin-bottom:4px;
    }
    .erp-user small{
      color:#9ca3af;
      display:block;
      margin-bottom:12px;
    }
    .erp-user .btn{
      width:100%;
      text-align:center;
      display:inline-block;
      box-sizing:border-box;
    }
    .erp-main{
      padding:24px;
    }
    .erp-title h1{
      margin:0;
      font-size:2rem;
    }
    .erp-title p{
      margin:8px 0 0;
      color:#9ca3af;
    }
    .section{
      background:#111827;
      border:1px solid #1f2937;
      border-radius:18px;
      padding:20px;
      margin:20px 0;
    }
    .toolbar{
      display:grid;
      gap:12px;
      grid-template-columns:1fr 220px 220px;
      margin-bottom:16px;
    }
    .toolbar input,
    .toolbar select{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #2a3142;
      background:#141b2a;
      color:#fff;
      box-sizing:border-box;
    }
    .card-grid{
      display:grid;
      gap:16px;
      grid-template-columns:repeat(4,1fr);
      margin-top:20px;
    }
    .card-mini{
      background:#111827;
      border:1px solid #1f2937;
      border-radius:16px;
      padding:18px;
    }
    .card-mini small{
      display:block;
      color:#9ca3af;
      margin-bottom:8px;
    }
    .card-mini strong{
      font-size:1.2rem;
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:#0b1220;
      border:1px solid #1f2937;
      border-radius:16px;
      overflow:hidden;
    }
    th,td{
      padding:12px 10px;
      text-align:left;
      border-bottom:1px solid #1f2937;
      vertical-align:top;
    }
    th{
      background:#131c2e;
    }
    .tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:.85rem;
      font-weight:700;
      border:1px solid #333;
    }
    .tag.push{
      color:#ffd166;
      border-color:#70561a;
    }
    .tag.pull{
      color:#7ec8ff;
      border-color:#275a7d;
    }
    .tag.critico{
      color:#ff8b8b;
      border-color:#7a2f2f;
    }
    .tag.normal{
      color:#7CFC98;
      border-color:#1f6b37;
    }
    .empty{
      padding:18px;
      border:1px dashed #374151;
      border-radius:14px;
      color:#9ca3af;
    }
    @media (max-width:1100px){
      .toolbar,.card-grid{
        grid-template-columns:1fr;
      }
    }
    @media (max-width:800px){
      .erp-layout{
        grid-template-columns:1fr;
      }
      .erp-sidebar{
        border-right:none;
        border-bottom:1px solid #1f2937;
      }
    }
  </style>
</head>
<body>
  <div class="erp-layout">
    <aside class="erp-sidebar">
      <a class="erp-brand" href="dashboard-erp-logistica.html">Ballers ERP</a>
      <div class="erp-subtitle">Panel de logística</div>

      <nav class="erp-menu">
        <a href="dashboard-erp-logistica.html">Dashboard</a>
        <a href="ordenes-erp-logistica.html">Órdenes</a>
        <a href="inventario-erp-logistica.html" class="active">Inventario</a>
        <a href="procesos-erp-logistica.html">Procesos</a>
        <a href="recursos-erp-logistica.html">Recursos</a>
      </nav>

      <div class="erp-user">
        <strong id="erp-user-name">Logística</strong>
        <small id="erp-user-role">logistica</small>
        <a class="btn btn--ghost" href="index-logistica.html">Volver al panel</a>
      </div>
    </aside>

    <main class="erp-main">
      <div class="erp-title">
        <h1>Inventario ERP Logística</h1>
        <p>Vista operativa del inventario para monitoreo de stock y estrategia logística.</p>
      </div>

      <section class="card-grid">
        <article class="card-mini">
          <small>Total de productos</small>
          <strong id="kpi-total">0</strong>
        </article>
        <article class="card-mini">
          <small>Stock crítico</small>
          <strong id="kpi-critico">0</strong>
        </article>
        <article class="card-mini">
          <small>Estrategia PUSH</small>
          <strong id="kpi-push">0</strong>
        </article>
        <article class="card-mini">
          <small>Estrategia PULL</small>
          <strong id="kpi-pull">0</strong>
        </article>
      </section>

      <section class="section">
        <div class="toolbar">
          <input id="buscar" type="text" placeholder="Buscar por producto, categoría o proveedor" />
          <select id="filtro-estrategia">
            <option value="">Todas las estrategias</option>
            <option value="PUSH">PUSH</option>
            <option value="PULL">PULL</option>
          </select>
          <select id="filtro-stock">
            <option value="">Todos los niveles</option>
            <option value="critico">Stock crítico</option>
            <option value="normal">Stock normal</option>
          </select>
        </div>

        <div id="tabla-wrap"></div>
      </section>
    </main>
  </div>

  <script>
    const tablaWrap = document.getElementById('tabla-wrap');
    const buscar = document.getElementById('buscar');
    const filtroEstrategia = document.getElementById('filtro-estrategia');
    const filtroStock = document.getElementById('filtro-stock');

    let productos = [];

    function cargarUsuario() {
      const nombre = localStorage.getItem('ballers_user_name') || localStorage.getItem('ballers_user_nombre') || 'Logística';
      const rol = localStorage.getItem('ballers_user_rol') || 'logistica';
      document.getElementById('erp-user-name').textContent = nombre;
      document.getElementById('erp-user-role').textContent = rol;
    }

    function tagEstrategia(valor) {
      const clase = String(valor || '').toLowerCase();
      return `<span class="tag ${clase}">${valor || '-'}</span>`;
    }

    function tagStock(actual, minimo) {
      const critico = Number(actual) <= Number(minimo);
      return critico
        ? '<span class="tag critico">Crítico</span>'
        : '<span class="tag normal">Normal</span>';
    }

    function actualizarKpis(listaBase) {
      document.getElementById('kpi-total').textContent = listaBase.length;
      document.getElementById('kpi-critico').textContent = listaBase.filter(p => Number(p.stock_actual) <= Number(p.stock_minimo)).length;
      document.getElementById('kpi-push').textContent = listaBase.filter(p => p.estrategia_logistica === 'PUSH').length;
      document.getElementById('kpi-pull').textContent = listaBase.filter(p => p.estrategia_logistica === 'PULL').length;
    }

    function filtrarProductos() {
      const texto = buscar.value.trim().toLowerCase();
      const estrategia = filtroEstrategia.value;
      const stock = filtroStock.value;

      return productos.filter(p => {
        const coincideTexto =
          !texto ||
          (p.nombre || '').toLowerCase().includes(texto) ||
          (p.categoria || '').toLowerCase().includes(texto) ||
          (p.proveedor_nombre || '').toLowerCase().includes(texto);

        const coincideEstrategia = !estrategia || p.estrategia_logistica === estrategia;

        let coincideStock = true;
        if (stock === 'critico') coincideStock = Number(p.stock_actual) <= Number(p.stock_minimo);
        if (stock === 'normal') coincideStock = Number(p.stock_actual) > Number(p.stock_minimo);

        return coincideTexto && coincideEstrategia && coincideStock;
      });
    }

    function renderTabla() {
      const lista = filtrarProductos();

      if (!lista.length) {
        tablaWrap.innerHTML = '<div class="empty">No hay productos para mostrar.</div>';
        return;
      }

      tablaWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Proveedor</th>
              <th>Stock actual</th>
              <th>Stock mínimo</th>
              <th>Nivel</th>
              <th>Estrategia</th>
              <th>Costo unitario</th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(p => `
              <tr>
                <td>${p.id}</td>
                <td>${p.nombre || '-'}</td>
                <td>${p.categoria || '-'}</td>
                <td>${p.proveedor_nombre || '-'}</td>
                <td>${p.stock_actual ?? 0}</td>
                <td>${p.stock_minimo ?? 0}</td>
                <td>${tagStock(p.stock_actual, p.stock_minimo)}</td>
                <td>${tagEstrategia(p.estrategia_logistica)}</td>
                <td>$${Number(p.costo_unitario || 0).toFixed(2)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function cargarProductos() {
      try {
        const resp = await fetch('/api/productos');
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.message || 'No se pudo cargar el inventario');
        }

        productos = data;
        actualizarKpis(productos);
        renderTabla();
      } catch (error) {
        console.error(error);
        tablaWrap.innerHTML = '<div class="empty">No se pudo cargar el inventario.</div>';
      }
    }

    buscar.addEventListener('input', renderTabla);
    filtroEstrategia.addEventListener('change', renderTabla);
    filtroStock.addEventListener('change', renderTabla);

    cargarUsuario();
    cargarProductos();
  </script>
</body>
</html>
