<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Usuarios internos | Ballers CRM</title>
  <link rel="stylesheet" href="../../css/base.css"/>
  <style>
    .section{
      background:linear-gradient(180deg,rgba(255,106,0,.06),transparent 60%),var(--panel);
      border:1px solid #23232a;
      border-radius:var(--radius);
      padding:22px;
      box-shadow:var(--shadow);
      margin:18px 0
    }
    .grid-2{display:grid;gap:18px}
    @media (min-width:1000px){.grid-2{grid-template-columns:380px 1fr}}
    .form-grid{display:grid;gap:12px}
    .form-row{display:grid;gap:6px}
    .form-row input,.form-row select{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #2a2a32;
      background:#141419;
      color:var(--text)
    }
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .toolbar{display:grid;gap:12px;margin-bottom:16px}
    @media (min-width:900px){.toolbar{grid-template-columns:1fr 220px}}
    .toolbar input,.toolbar select{
      width:100%;
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #2a2a32;
      background:#141419;
      color:var(--text)
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:#111;
      border:1px solid #23232a;
      border-radius:16px;
      overflow:hidden;
    }
    th,td{
      padding:12px 10px;
      text-align:left;
      border-bottom:1px solid #23232a;
      vertical-align:top;
    }
    th{background:#17171c}
    .tag{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:.85rem;
      font-weight:700;
      border:1px solid #333;
    }
    .tag.administrador{color:#ffd166;border-color:#70561a}
    .tag.ventas{color:#7CFC98;border-color:#1f6b37}
    .tag.logistica{color:#7ec8ff;border-color:#275a7d}
    .tag.soporte{color:#ff9ad5;border-color:#7c2d5d}
    .msg{margin-top:12px;font-weight:700}
    .msg.error{color:#ff6b6b}
    .msg.ok{color:#7CFC98}
    .empty{
      padding:18px;
      border:1px dashed #333;
      border-radius:14px;
      color:var(--muted)
    }
    .warn{
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      background:#1a1410;
      border:1px solid #4b3218;
      color:#ffd166;
    }
  </style>
</head>
<body>
<header class="internal-header">
  <div class="container internal-header__inner">
    <a class="logo" href="../../../../index.html">Ballers <span aria-hidden="true">🏀👟</span></a>

    <button class="btn btn--ghost internal-back" type="button" onclick="history.back()">
      ← Volver
    </button>
  </div>
</header>

  <main class="container" style="padding:22px 0 64px">
    <section class="section">
      <h2 style="margin:0 0 6px">Usuarios internos</h2>
      <p class="muted" style="margin:0">
        Solo el administrador debe crear cuentas internas del sistema.
      </p>
    </section>

    <section class="grid-2">
      <article class="section">
        <h3 style="margin-top:0">Crear usuario interno</h3>

        <div id="admin-only-box">
          <form id="usuario-form" class="form-grid">
            <div class="form-row">
              <label for="nombre">Nombre</label>
              <input id="nombre" type="text" required />
            </div>

            <div class="form-row">
              <label for="correo">Correo</label>
              <input id="correo" type="email" required />
            </div>

            <div class="form-row">
              <label for="rol">Rol</label>
              <select id="rol" required>
                <option value="">Selecciona un rol</option>
                <option value="administrador">Administrador</option>
                <option value="ventas">Ventas</option>
                <option value="logistica">Logística</option>
                <option value="soporte">Soporte</option>
              </select>
            </div>

            <div class="form-row">
              <label for="password">Contraseña</label>
              <input id="password" type="password" required />
            </div>

            <div class="actions">
              <button class="btn" type="submit">Crear usuario</button>
            </div>

            <div id="mensaje" class="msg"></div>
          </form>
        </div>

        <div id="no-admin-msg" class="warn" style="display:none">
          No tienes permisos de administrador para crear usuarios internos.
        </div>
      </article>

      <article class="section">
        <div class="toolbar">
          <input id="buscar" type="text" placeholder="Buscar por nombre o correo" />
          <select id="filtro-rol">
            <option value="">Todos los roles</option>
            <option value="administrador">Administrador</option>
            <option value="ventas">Ventas</option>
            <option value="logistica">Logística</option>
            <option value="soporte">Soporte</option>
          </select>
        </div>

        <div id="tabla-wrap"></div>
      </article>
    </section>
  </main>

  <footer class="footer" style="background:#0f0f0f; color:#ccc; padding:25px 0; margin-top:40px; font-family:'Poppins',sans-serif;">
    <div class="container footer__inner" style="display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;">
      <small style="color:#aaa;">© 2025 Ballers. Todos los derechos reservados.</small>
    </div>
  </footer>

  <script src="../../js/app.js"></script>
  <script>
    const form = document.getElementById('usuario-form');
    const mensaje = document.getElementById('mensaje');
    const tablaWrap = document.getElementById('tabla-wrap');
    const buscar = document.getElementById('buscar');
    const filtroRol = document.getElementById('filtro-rol');

    let usuarios = [];

    function verificarPermisoAdmin() {
      const tipo = localStorage.getItem('ballers_user_tipo');
      const rol = localStorage.getItem('ballers_user_rol');

      if (tipo !== 'interno' || rol !== 'administrador') {
        document.getElementById('admin-only-box').style.display = 'none';
        document.getElementById('no-admin-msg').style.display = 'block';
      }
    }

    function tagRol(rol) {
      return `<span class="tag ${rol}">${rol}</span>`;
    }

    function filtrarUsuarios() {
      const texto = buscar.value.trim().toLowerCase();
      const rol = filtroRol.value;

      return usuarios.filter(u => {
        const coincideTexto =
          !texto ||
          u.nombre.toLowerCase().includes(texto) ||
          u.correo.toLowerCase().includes(texto);

        const coincideRol = !rol || u.rol === rol;

        return coincideTexto && coincideRol;
      });
    }

    function renderTabla() {
      const lista = filtrarUsuarios();

      if (!lista.length) {
        tablaWrap.innerHTML = `<div class="empty">No hay usuarios internos para mostrar.</div>`;
        return;
      }

      tablaWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Fecha de creación</th>
            </tr>
          </thead>
          <tbody>
            ${lista.map(u => `
              <tr>
                <td>${u.id}</td>
                <td>${u.nombre}</td>
                <td>${u.correo}</td>
                <td>${tagRol(u.rol)}</td>
                <td>${new Date(u.creado_en).toLocaleString('es-MX')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function cargarUsuarios() {
      try {
        const resp = await fetch('/api/usuarios-internos');
        usuarios = await resp.json();
        renderTabla();
      } catch (error) {
        console.error(error);
        tablaWrap.innerHTML = `<div class="empty">No se pudieron cargar los usuarios internos.</div>`;
      }
    }

    form?.addEventListener('submit', async (e) => {
      e.preventDefault();

      mensaje.textContent = '';
      mensaje.className = 'msg';

      const tipo = localStorage.getItem('ballers_user_tipo');
      const rolActual = localStorage.getItem('ballers_user_rol');

      if (tipo !== 'interno' || rolActual !== 'administrador') {
        mensaje.textContent = 'No tienes permisos para crear usuarios internos';
        mensaje.classList.add('error');
        return;
      }

      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const rol = document.getElementById('rol').value;
      const password = document.getElementById('password').value.trim();

      if (!nombre || !correo || !rol || !password) {
        mensaje.textContent = 'Completa todos los campos';
        mensaje.classList.add('error');
        return;
      }

      if (password.length < 6) {
        mensaje.textContent = 'La contraseña debe tener al menos 6 caracteres';
        mensaje.classList.add('error');
        return;
      }

      try {
        const resp = await fetch('/api/usuarios-internos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ nombre, correo, rol, password })
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mensaje.textContent = data.message || 'No se pudo crear el usuario';
          mensaje.classList.add('error');
          return;
        }

        mensaje.textContent = 'Usuario interno creado correctamente';
        mensaje.classList.add('ok');
        form.reset();
        await cargarUsuarios();
      } catch (error) {
        console.error(error);
        mensaje.textContent = 'Error de conexión con el servidor';
        mensaje.classList.add('error');
      }
    });

    buscar.addEventListener('input', renderTabla);
    filtroRol.addEventListener('change', renderTabla);

    verificarPermisoAdmin();
    cargarUsuarios();
  </script>
</body>
</html>
