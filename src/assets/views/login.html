<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Ballers</title>
  <link rel="stylesheet" href="../css/base.css"/>
  <style>
    .auth-wrap{min-height:calc(100dvh - 80px);display:grid;place-items:center;padding:24px 0}
    .auth-card{width:100%;max-width:520px;background:var(--panel);border:1px solid #23232a;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    .auth-card h2{margin:0 0 8px}
    .auth-row{margin-top:12px}
    .auth-row label{display:block;font-weight:700;margin:0 0 8px}
    .auth-row input,.auth-row select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2a2a32;background:#141419;color:var(--text)}
    .auth-actions{margin-top:18px;display:flex;justify-content:center}
    .auth-actions .btn{min-width:160px;text-align:center}
    .alt{margin-top:14px;text-align:center}
    .alt a{color:var(--text);text-decoration:underline}
    .msg{margin-top:14px;text-align:center;font-weight:700}
    .msg.error{color:#ff6b6b}
    .msg.ok{color:#7CFC98}
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="../../../index.html">Ballers <span aria-hidden="true">🏀👟</span></a>

      <form class="search" role="search" aria-label="Buscar productos">
        <label class="visually-hidden" for="q">Buscar</label>
        <input id="q" type="search" placeholder="Buscar…" />
        <button type="submit" aria-label="Buscar">🔍</button>
      </form>

      <button class="nav__toggle" aria-expanded="false" aria-controls="mainnav">☰</button>
      <nav id="mainnav" class="nav">
        <ul>
          <li><a href="../../../index.html">Inicio</a></li>
          <li><a href="catalog.html">Catálogo</a></li>

          <li>
            <a class="nav__user active" href="login.html" aria-label="Iniciar sesión">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none"/>
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container auth-wrap">
    <section class="auth-card" aria-labelledby="titulo-login">
      <h2 id="titulo-login">Iniciar sesión</h2>

      <form id="login-form" autocomplete="on">
        <div class="auth-row">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" autocomplete="username" required />
        </div>

        <div class="auth-row">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        <div class="auth-actions">
          <button class="btn" type="submit" id="btn-login">Entrar</button>
        </div>

        <p class="alt">¿No tienes cuenta? <a href="signup.html">Crear cuenta</a></p>
        <div id="mensaje" class="msg"></div>
      </form>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script>
    document.querySelector('.search')?.addEventListener('submit', e => e.preventDefault());

    const form = document.getElementById('login-form');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      mensaje.textContent = '';
      mensaje.className = 'msg';

      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!correo || !password) {
        mensaje.textContent = 'Completa todos los campos';
        mensaje.classList.add('error');
        return;
      }

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ correo, password })
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mensaje.textContent = data.message || 'No se pudo iniciar sesión';
          mensaje.classList.add('error');
          return;
        }

        const userIdFinal =
          data.usuario.tipo_cuenta === 'cliente'
            ? (data.usuario.cliente_id || data.usuario.id)
            : data.usuario.id;

        localStorage.setItem('ballers_auth', 'true');
        localStorage.setItem('ballers_user_id', userIdFinal);
        localStorage.setItem('ballers_user_nombre', data.usuario.nombre);
        localStorage.setItem('ballers_user_name', data.usuario.nombre);
        localStorage.setItem('ballers_user_correo', data.usuario.correo);
        localStorage.setItem('ballers_user_tipo', data.usuario.tipo_cuenta);
        localStorage.setItem('ballers_user_rol', data.usuario.rol);
        localStorage.setItem('ballers_user_role', data.usuario.rol);

        mensaje.textContent = 'Inicio de sesión correcto';
        mensaje.classList.add('ok');

        setTimeout(() => {
          if (data.usuario.tipo_cuenta === 'interno') {
            if (data.usuario.rol === 'administrador') {
              window.location.href = 'interno/index.html';
            } else if (data.usuario.rol === 'ventas') {
              window.location.href = 'interno/index-ventas.html';
            } else if (data.usuario.rol === 'logistica') {
              window.location.href = 'interno/index-logistica.html';
            } else if (data.usuario.rol === 'soporte') {
  window.location.href = 'interno/index-soporte.html';
            } else {
              window.location.href = 'interno/index.html';
            }
          } else {
            window.location.href = 'cliente/index.html';
          }
        }, 800);

      } catch (error) {
        mensaje.textContent = 'Error de conexión con el servidor';
        mensaje.classList.add('error');
        console.error(error);
      }
    });
  </script>
</body>
</html>
