<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear cuenta | Ballers</title>
  <link rel="stylesheet" href="../css/base.css"/>
  <style>
    .auth-wrap{min-height:calc(100dvh - 80px);display:grid;place-items:center;padding:24px 0}
    .auth-card{width:100%;max-width:520px;background:var(--panel);border:1px solid #23232a;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    .auth-card h2{margin:0 0 8px}
    .auth-row{margin-top:12px}
    .auth-row label{display:block;font-weight:700;margin:0 0 8px}
    .auth-row input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2a2a32;background:#141419;color:var(--text)}
    .auth-actions{margin-top:18px;display:flex;justify-content:center}
    .auth-actions .btn{min-width:180px;text-align:center}
    .alt{margin-top:14px;text-align:center}
    .alt a{color:var(--text);text-decoration:underline}
    .msg{margin-top:14px;text-align:center;font-weight:700}
    .msg.error{color:#ff6b6b}
    .msg.ok{color:#7CFC98}
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="../../../index.html">Ballers <span aria-hidden="true">🏀👟</span></a>

      <form class="search" role="search" aria-label="Buscar productos">
        <label class="visually-hidden" for="q">Buscar</label>
        <input id="q" type="search" placeholder="Buscar…"/>
        <button type="submit" aria-label="Buscar">🔍</button>
      </form>

      <button class="nav__toggle" aria-expanded="false" aria-controls="mainnav">☰</button>
      <nav id="mainnav" class="nav">
        <ul>
          <li><a href="../../../index.html">Inicio</a></li>
          <li><a href="catalog.html">Catálogo</a></li>

          <li>
            <a class="nav__user" href="login.html" aria-label="Iniciar sesión">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none"/>
              </svg>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container auth-wrap">
    <section class="auth-card" aria-labelledby="titulo-signup">
      <h2 id="titulo-signup">Crear cuenta de cliente</h2>

      <form id="signup-form" autocomplete="on">
        <div class="auth-row">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required />
        </div>

        <div class="auth-row">
          <label for="correo">Correo electrónico</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required />
        </div>

        <div class="auth-row">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="text" autocomplete="tel" />
        </div>

        <div class="auth-row">
          <label for="empresa">Empresa</label>
          <input id="empresa" name="empresa" type="text" />
        </div>

        <div class="auth-row">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required />
        </div>

        <div class="auth-row">
          <label for="password2">Confirmar contraseña</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" required />
        </div>

        <div class="auth-actions">
          <button class="btn" type="submit" id="btn-create">Crear cuenta</button>
        </div>

        <p class="alt">¿Ya tienes cuenta? <a href="login.html">Entrar</a></p>
        <div id="mensaje" class="msg"></div>
      </form>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script>
    document.querySelector('.search')?.addEventListener('submit', e => e.preventDefault());

    const form = document.getElementById('signup-form');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      mensaje.textContent = '';
      mensaje.className = 'msg';

      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const telefono = document.getElementById('telefono').value.trim();
      const empresa = document.getElementById('empresa').value.trim();
      const password = document.getElementById('password').value.trim();
      const password2 = document.getElementById('password2').value.trim();

      if (!nombre || !correo || !password || !password2) {
        mensaje.textContent = 'Completa los campos obligatorios';
        mensaje.classList.add('error');
        return;
      }

      if (password !== password2) {
        mensaje.textContent = 'Las contraseñas no coinciden';
        mensaje.classList.add('error');
        return;
      }

      if (password.length < 6) {
        mensaje.textContent = 'La contraseña debe tener al menos 6 caracteres';
        mensaje.classList.add('error');
        return;
      }

      try {
        const resp = await fetch('/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            nombre,
            correo,
            telefono,
            empresa,
            password,
            tipo_cuenta: 'cliente',
            rol: 'cliente'
          })
        });

        const data = await resp.json();

        if (!resp.ok || !data.ok) {
          mensaje.textContent = data.message || 'No se pudo crear la cuenta';
          mensaje.classList.add('error');
          return;
        }

        mensaje.textContent = 'Cuenta creada correctamente. Ahora inicia sesión.';
        mensaje.classList.add('ok');

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);

      } catch (error) {
        mensaje.textContent = 'Error de conexión con el servidor';
        mensaje.classList.add('error');
        console.error(error);
      }
    });
  </script>
</body>
</html>
